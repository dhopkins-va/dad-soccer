name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lecture/package.json

      - name: Install lecture dependencies
        working-directory: lecture
        run: npm ci

      - name: Build Slidev deck
        working-directory: lecture
        run: npm run build

      - name: Prepare deployment artifact
        run: |
          mkdir -p _site/lecture
          # Copy root app files
          cp index.html _site/
          cp app.js _site/
          cp style.css _site/
          cp config.js _site/
          cp logic.js _site/
          cp icon.svg _site/
          cp manifest.webmanifest _site/
          cp .nojekyll _site/
          # Copy built lecture deck
          cp -r lecture/dist/* _site/lecture/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
